### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
deepspeed: examples/deepspeed/ds_z3_config.json
resume_from_checkpoint: false
batch_eval_metrics: true
compute_classification_accuracy: true
### dataset
dataset: mc_question_perception_test_train
eval_dataset: mc_question_perception_test_valid
streaming: true
accelerator_config:
  dispatch_batches: false
template: qwen2_vl
cutoff_len: 32768 #1024
overwrite_cache: false
preprocessing_num_workers: null # 4 gpus * 8 cpus per gpu = 32 vCPUs # 16 # TODO: tune to max GPU usage without getting CPU throttled # for dev / debug 1
preprocessing_batch_size: 16 # 2 # 1 # The number of examples in one group in pre-processing.
buffer_size: 2 # maybe per gpu?

video_resolution: 100000000 # 128 # Keeps the height or width of video below this resolution.
video_maxlen: 100000 # The maximum number of sampled frames for video inputs.
max_pixels: 63504 # 81 * 28 * 28
min_pixels: 62720 # 80 * 28 * 28
video_fps: 2
use_qwen2vl_processor: true
image_resolution: 100000000  # i think this is only an upper bound, so setting to ridiculously high


### output
logging_steps: 5 # 10
save_steps: 116 # every epoch - 4715 / 32 = (assuming it ignores gradient accumulation, otherwise we should divide this by 4)
plot_loss: true
# overwrite_output_dir: true

### train
flash_attn: fa2
#  ValueError: To use a `DataLoader` in `split_batches` mode, the batch size (2) needs to be a round multiple of the number of processes (4).
per_device_train_batch_size: 1 # 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4 

max_steps: 462 # 7392 * 4 / 64 = 462
num_train_epochs: 4

# without split_batches, it fails to concatenate sequences of different lengths
# split_batches: true # ValueError: To use a `DataLoader` in `split_batches` mode, the batch size (2) needs to be a round multiple of the number of processes (4).
lr_scheduler_type: constant
warmup_ratio: 0.1
bf16: true
ddp_timeout: 9000 # 180000000

### eval
val_size: 0 # 0.01 # Streaming mode should have an integer val size. # If you use a value different than 0, you get: `Cannot specify `val_size` if `eval_dataset` is not None.Cannot specify `val_size` if `eval_dataset` is not None.`
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 116 # 500 # lower for dev
seed: 42


report_to: wandb
run_name: 4epoch_lr1e-4_constantLR_bs1_ga2_dsz3_warmup0.1_bs128_streaming
