output_dir: output/qwen25_vl-7b/mc_question_perception_test/qwen25vl_lora_sft_mc_question_perception_34stepsWarmup_32bs_2ga_9trueEpoch_0.001inverseSqrtLR_streaming_loraRank512_v0.2correct_top1
