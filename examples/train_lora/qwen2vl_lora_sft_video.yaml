### model
model_name_or_path: Qwen/Qwen2-VL-7B-Instruct
image_resolution: 262144
video_resolution: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: mllm_video_demo_mp4 # mllm_video_demo,identity  # video: mllm_video_demo
template: qwen2_vl
cutoff_len: 32768 # 1024
# max_samples: 1000 # max_samples is incompatible with streaming
overwrite_cache: true
preprocessing_num_workers: 16
streaming: true 
val_size: 0 # ValueError: Streaming mode should have an integer val size.
max_steps: 10
eval_dataset: mllm_video_demo_mp4

### output
output_dir: saves/qwen2_vl-7b/lora/sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
